protocol: Modbus RTU
version:
  major: 1
  minor: 1
unit_id: 1
serial:
  baud: 19200
  data_bits: 8
  parity: even
  stop_bits: 1
addressing: zero_based_pdu_offset
word_order_32bit: high_word_first
byte_order_per_word: big_endian
polling:
  input_start: 100
  input_count: 40
  period_ms: 1000
  critical_max_age_ms: 3000
  client_loss_timeout_ms: 3000
validity_bits:
  0: feed_ec
  1: permeate_ec
  2: permeate_flow
  3: concentrate_flow
  4: permeate_temp
  5: concentrate_temp
  6: ro_feed_pressure
  7: tank_volume
  8: left_load_cell
  9: right_load_cell
  10: feed_temp_optional
critical_validity_bits:
- 0
- 1
- 2
- 3
- 7
status_bits:
  0: operational
  1: calibration_required
  2: configuration_crc_error
  3: watchdog_reset_seen
  4: overflow_or_saturation
fault_bits:
  0: ec_feed_fault
  1: ec_permeate_fault
  2: flow_permeate_fault
  3: flow_concentrate_fault
  4: temperature_fault
  5: pressure_fault
  6: hx711_left_fault
  7: hx711_right_fault
  8: stale_acquisition
  9: nonvolatile_config_fault
input_registers:
- address: 100
  name: protocol_major
  type: u16
  words: 1
  scale_divisor: 1
  unit: version
  access: read_only
- address: 101
  name: protocol_minor
  type: u16
  words: 1
  scale_divisor: 1
  unit: version
  access: read_only
- address: 102
  name: snapshot_sequence
  type: u16
  words: 1
  scale_divisor: 1
  unit: count
  access: read_only
- address: 103
  name: module_status
  type: u16
  words: 1
  scale_divisor: 1
  unit: bitmask
  access: read_only
- address: 104
  name: validity_mask
  type: u16
  words: 1
  scale_divisor: 1
  unit: bitmask
  access: read_only
- address: 105
  name: fault_mask
  type: u16
  words: 1
  scale_divisor: 1
  unit: bitmask
  access: read_only
- address: 106
