; Bench bring-up probe for the sensor-node ESP32-S3 N16R8 clone board (ADR-0012).
; Bench tool only: pure ESP-IDF, not the node runtime (ADR-0007 is unaffected).
; See README.md for safety preconditions before flashing.

[platformio]
default_envs = bringup

[env]
platform = espressif32@6.13.0
framework = espidf
board = esp32-s3-devkitc-1
; Clone board: 16 MB flash, 8 MB octal PSRAM (esptool bench result, ADR-0012).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; DIO, not QIO: the flash is manufacturer 0x1C, which is not in ESP-IDF 5.5's
; QIO-enable table, so QIO would make the bootloader write the status register
; of an unknown part with the generic default procedure. See README.md.
board_build.flash_mode = dio
board_build.partitions = partitions_bringup.csv
monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800

; Default: no Wi-Fi or Bluetooth code linked.
[env:bringup]

; Opt-in: adds a passive (receive-only) Wi-Fi scan to judge which antenna is active.
[env:bringup_wifi]
build_flags = -DBRINGUP_WIFI=1
