; Sensor-node firmware (ADR-0007). Only the PC build exists so far.
; The ESP32-S3 environment and its pinned platform are TBD (issue #17): the
; official espressif32@6.13.0 bundles Arduino-ESP32 2.0.17, below the >= 3.0
; that ADR-0007 requires.
; Build: pio run -e native   (needs g++ on PATH)
; Test:  uv run --project host_tools pytest host_tools/tests/test_node_wire.py

[platformio]
default_envs = native

[env:native]
platform = platformio/native@1.2.1
lib_extra_dirs = ../lib
build_src_filter = +<host/>
; No exceptions, RTTI or newer C++ than the ESP32 toolchain is likely to take.
build_flags = -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror
extra_scripts = host_link.py
