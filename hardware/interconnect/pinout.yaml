# Normative RJ45 trunk pinout for the RO node bus. T568B wiring, shielded Cat5e/Cat6.
# Test: host_tools/tests/test_interconnect_docs.py
connector: RJ45 shielded, red cable and jacks, label "RO BUS - 24V"
supply_nominal_v: 24
pins:
  1: "+24V"
  2: "+24V"
  3: RESERVED
  4: RS485_A
  5: RS485_B
  6: RESERVED
  7: GND
  8: GND
shell: SHIELD

# 1-Wire monitoring bus. NOT part of the RJ45 trunk. Carrier-side values are designed in ADR-0012;
# connector, cable and device-count items stay TBD (owner part or bench, AGENTS.md rule 5).
onewire:
  connector: Nilight 3-pin waterproof male/female harness connector
  form: inline wire-to-wire (not panel mount); one male-end and one female-end pigtail per node, through a cable gland
  label: "1-WIRE"
  signals:
    +5V:
      cavity: TBD
    DATA:
      cavity: TBD
    GND:
      cavity: TBD
  rating_voltage: TBD
  rating_current: TBD
  power: node 5V rail, non-parasitic
  polyfuse: Bourns MF-R010, 0.10 A hold, 0.20 A trip at 23 C, 60 V (ADR-0012)
  pull_up: DS2482-100 internal RWPU 1000-1675 ohm to 3.3 V with active pullup; external pull-up unfitted (ADR-0012)
  gpio: none; DS2482S-100+ I2C 1-Wire master at 0x18 on the shared I2C bus (ADR-0012)
  series_resistor: 33 ohm between DS2482 IO and DATA (ADR-0012)
  esd: TI TPD1E10B06 on DATA and on +5V (ADR-0012)
  max_length: TBD
  shield: continuous along the chain, bonded at one point only; bonding location TBD
  max_devices: TBD  # electrical limit; the protocol slot limit is 8 (not an electrical rating)
  rescan_interval: TBD
  monitoring_only: true
