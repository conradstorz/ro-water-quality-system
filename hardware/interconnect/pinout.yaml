# Normative RJ45 trunk pinout for the RO node bus. T568B wiring, shielded Cat5e/Cat6.
# Test: host_tools/tests/test_interconnect_docs.py
connector: RJ45 shielded, red cable and jacks, label "RO BUS - 24V"
supply_nominal_v: 24
pins:
  1: "+24V"
  2: "+24V"
  3: RESERVED
  4: RS485_A
  5: RS485_B
  6: RESERVED
  7: GND
  8: GND
shell: SHIELD

# 1-Wire monitoring bus. NOT part of the RJ45 trunk. Nothing here is verified; every TBD stays TBD (AGENTS.md rule 5).
onewire:
  connector: Nilight 3-pin waterproof male/female harness connector
  form: inline wire-to-wire (not panel mount); one male-end and one female-end pigtail per node, through a cable gland
  label: "1-WIRE"
  signals:
    +5V:
      cavity: TBD
    DATA:
      cavity: TBD
    GND:
      cavity: TBD
  rating_voltage: TBD
  rating_current: TBD
  power: node 5V rail, non-parasitic
  polyfuse: TBD
  pull_up: TBD
  gpio: TBD
  max_length: TBD
  shield: bonded at the node end only
  monitoring_only: true
